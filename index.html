<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PXLZ — Compressed Image Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Unbounded:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <style>
    /* ── TOKENS ───────────────────────────────────────────── */
    :root {
      --bg:         #060608;
      --surf:       #0e0e12;
      --surf2:      #16161c;
      --border:     #1e1e28;
      --border-hi:  #2e2e3e;
      --accent:     #00f0c8;   /* teal-mint */
      --accent2:    #7c4dff;   /* violet */
      --accent-dim: #00bfa0;
      --warn:       #ff5252;
      --ok:         #00e676;
      --text-hi:    #eeeef5;
      --text-mid:   #7878a0;
      --text-lo:    #3a3a55;
      --mono:       'IBM Plex Mono', monospace;
      --display:    'Unbounded', sans-serif;
      --r:          8px;
      --r-lg:       14px;
      --ease:       cubic-bezier(.4,0,.2,1);
    }

    /* ── RESET ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-hi);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── SCANLINE TEXTURE ─────────────────────────────────── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 9998;
    }

    /* ── GLOW BLOBS (bg atmosphere) ──────────────────────── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--accent2); top: -100px; left: -100px; }
    .blob-2 { width: 400px; height: 400px; background: var(--accent);  bottom: -80px; right: -80px; }

    /* ── WRAPPER ──────────────────────────────────────────── */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* ── HEADER ───────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-family: var(--display);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-mid);
      border: 1px solid var(--border-hi);
      padding: 4px 10px;
      border-radius: 100px;
    }
    .chip.accent { border-color: var(--accent); color: var(--accent); }

    /* ── TABS ─────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 3px;
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 4px;
      width: fit-content;
      margin-bottom: 28px;
    }

    .tab {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 20px;
      border: none; border-radius: var(--r);
      background: transparent;
      color: var(--text-mid);
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: color 200ms var(--ease), background 200ms var(--ease);
    }
    .tab svg { width: 14px; height: 14px; }
    .tab:hover { color: var(--text-hi); }
    .tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* ── GRID ─────────────────────────────────────────────── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── CARD ─────────────────────────────────────────────── */
    .card {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }

    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .card-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-mid);
    }

    .card-body { padding: 18px; }

    /* ── STATUS PILL ──────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 100px;
      border: 1px solid var(--border-hi);
      color: var(--text-mid);
    }
    .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-lo); }
    .pill.live  { border-color: var(--ok);   color: var(--ok);   }
    .pill.live  .dot { background: var(--ok);  animation: blink 1.4s infinite; }
    .pill.err   { border-color: var(--warn);  color: var(--warn); }
    .pill.err   .dot { background: var(--warn); }
    .pill.done  { border-color: var(--accent); color: var(--accent); }
    .pill.done  .dot { background: var(--accent); }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── VIDEO ────────────────────────────────────────────── */
    .video-wrap {
      position: relative;
      width: 100%; aspect-ratio: 4/3;
      background: #000;
      border-radius: var(--r);
      overflow: hidden;
    }
    #cam-video { width:100%; height:100%; object-fit:cover; display:block; }
    #cap-canvas { display:none; }

    .vid-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: var(--surf2);
      color: var(--text-mid);
      text-align: center; padding: 24px;
      transition: opacity 200ms;
    }
    .vid-overlay svg { width: 36px; height: 36px; opacity: .35; }
    .vid-overlay p   { font-size: 11px; }
    .vid-overlay.hidden { display: none; }
    .vid-overlay.err { color: var(--warn); }
    .vid-overlay.err svg { opacity: .6; }

    /* corner brackets */
    .brackets {
      position: absolute; inset: 10px;
      pointer-events: none; opacity: 0;
      transition: opacity 300ms;
    }
    .brackets.show { opacity: 1; }
    .brackets::before, .brackets::after,
    .brackets > span::before, .brackets > span::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-color: var(--accent); border-style: solid;
    }
    .brackets::before  { top:0; left:0;  border-width: 2px 0 0 2px; }
    .brackets::after   { top:0; right:0; border-width: 2px 2px 0 0; }
    .brackets > span::before { bottom:0; left:0;  border-width: 0 0 2px 2px; }
    .brackets > span::after  { bottom:0; right:0; border-width: 0 2px 2px 0; }

    /* flash */
    .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
    @keyframes flashAnim { 0%{opacity:0} 15%{opacity:.7} 100%{opacity:0} }
    .flash.go { animation: flashAnim 380ms ease-out forwards; }

    /* ── STATS TABLE ──────────────────────────────────────── */
    .stats {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .stats tr + tr { border-top: 1px solid var(--border); }
    .stats td {
      padding: 7px 0;
      font-size: 11px;
    }
    .stats td:first-child { color: var(--text-mid); width: 50%; }
    .stats td:last-child  { color: var(--text-hi); text-align: right; font-weight: 500; }

    /* ── PROGRESS BAR ─────────────────────────────────────── */
    .progress-wrap {
      margin-top: 14px;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-label {
      font-size: 10px; color: var(--text-mid);
      margin-bottom: 6px; letter-spacing: .06em;
    }
    .progress-track {
      height: 3px;
      background: var(--border-hi);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      width: 0%;
      transition: width 120ms linear;
    }

    /* ── COMPRESSION RATIO BADGE ──────────────────────────── */
    .ratio-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,240,200,.08);
      border: 1px solid rgba(0,240,200,.25);
      color: var(--accent);
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 100px;
      margin-top: 10px;
    }

    /* ── BUTTONS ──────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 18px;
      border-radius: var(--r);
      border: none;
      font-family: var(--display);
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: filter 160ms var(--ease), transform 100ms;
      white-space: nowrap;
    }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; transform: none !important; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.12); }

    .btn-ghost {
      background: transparent;
      color: var(--text-mid);
      border: 1px solid var(--border-hi);
    }
    .btn-ghost:hover:not(:disabled) { color: var(--text-hi); border-color: var(--text-mid); }

    .btn-capture {
      width: 100%; padding: 13px;
      font-size: 12px;
      border-radius: var(--r);
      margin-top: 12px;
    }

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    /* ── TOGGLE ───────────────────────────────────────────── */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      margin-top: 6px;
    }
    .toggle-label { font-size: 11px; color: var(--text-mid); }
    .sw { position:relative; width:40px; height:22px; display:inline-block; }
    .sw input { opacity:0; width:0; height:0; }
    .sw-track {
      position:absolute; inset:0;
      background: var(--border-hi);
      border-radius: 100px; cursor: pointer;
      transition: background 200ms;
    }
    .sw-track::after {
      content:''; position:absolute;
      top:3px; left:3px;
      width:16px; height:16px;
      background:#fff; border-radius:50%;
      transition: transform 200ms;
    }
    .sw input:checked + .sw-track { background: var(--accent); }
    .sw input:checked + .sw-track::after { transform: translateX(18px); }

    /* ── DROP ZONE ────────────────────────────────────────── */
    .drop {
      position: relative;
      border: 2px dashed var(--border-hi);
      border-radius: var(--r-lg);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 180ms, background 180ms;
    }
    .drop:hover, .drop.over {
      border-color: var(--accent);
      background: rgba(0,240,200,.03);
    }
    .drop input { position:absolute; inset:0; opacity:0; cursor:pointer; }
    .drop svg { width:28px; height:28px; color: var(--text-lo); margin-bottom:8px; }
    .drop .dt { font-family: var(--display); font-size:13px; font-weight:600; margin-bottom:4px; }
    .drop .ds { font-size:10px; color:var(--text-mid); letter-spacing:.06em; text-transform:uppercase; }

    /* ── IMAGE PREVIEW ────────────────────────────────────── */
    .img-wrap {
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: #000;
      min-height: 160px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .img-wrap img { max-width:100%; max-height:380px; display:block; }
    .img-empty { color:var(--text-lo); font-size:11px; text-align:center; padding:20px; }

    /* ── TOAST ────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--surf2);
      border: 1px solid var(--border-hi);
      color: var(--text-hi);
      font-family: var(--mono);
      font-size: 11px; letter-spacing:.05em;
      padding: 9px 18px;
      border-radius: 100px;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: transform 280ms cubic-bezier(.34,1.56,.64,1), opacity 280ms;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── FORMAT LEGEND ────────────────────────────────────── */
    .legend {
      background: var(--surf2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 16px;
      margin-top: 16px;
    }
    .legend-title {
      font-family: var(--display);
      font-size: 10px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 10px;
    }
    .legend-row {
      display: flex; align-items: baseline; gap: 10px;
      font-size: 11px; color: var(--text-mid);
      padding: 4px 0;
    }
    .legend-row + .legend-row { border-top: 1px solid var(--border); }
    .legend-key { color: var(--text-hi); font-weight: 500; min-width: 70px; }

    /* ── SCROLLBAR ────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 4px; }
    ::selection { background: var(--accent); color: #000; }

    /* ── FOOTER ───────────────────────────────────────────── */
    footer {
      text-align: center;
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 10px; color: var(--text-lo);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<!-- Atmospheric blobs -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div id="toast"></div>

<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="logo">PXLZ</div>
    <div class="header-right">
      <span class="chip accent">DEFLATE lossless</span>
      <span class="chip">No server · No upload</span>
    </div>
  </header>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" data-tab="camera" onclick="switchTab('camera')">
      <!-- camera -->
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Capture
    </button>
    <button class="tab" data-tab="decomp" onclick="switchTab('decomp')">
      <!-- box open -->
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="21 8 21 21 3 21 3 8"/>
        <rect x="1" y="3" width="22" height="5"/>
        <line x1="10" y1="12" x2="14" y2="12"/>
      </svg>
      Decompress
    </button>
  </div>

  <!-- ===================================================
       CAPTURE PANEL
  =================================================== -->
  <div id="panel-camera" class="panel active">
    <div class="grid-2">

      <!-- Camera feed -->
      <div class="card">
        <div class="card-head">
          <span class="card-label">Live Preview</span>
          <div class="pill" id="cam-pill">
            <span class="dot"></span>
            <span id="cam-pill-txt">Idle</span>
          </div>
        </div>
        <div class="card-body">
          <div class="video-wrap">
            <video id="cam-video" autoplay playsinline muted></video>
            <canvas id="cap-canvas"></canvas>
            <div class="brackets" id="brackets"><span></span></div>
            <div class="flash" id="flash"></div>
            <div class="vid-overlay" id="vid-overlay">
              <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              <p id="vid-overlay-msg">Camera not started</p>
            </div>
          </div>

          <button class="btn btn-primary btn-capture" id="btn-start" onclick="startCamera()">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <polygon points="10 8 16 12 10 16 10 8"/>
            </svg>
            Start Camera
          </button>
          <button class="btn btn-ghost btn-capture" id="btn-stop" onclick="stopCamera()" style="display:none">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <rect x="9" y="9" width="6" height="6"/>
            </svg>
            Stop Camera
          </button>
        </div>
      </div>

      <!-- Capture & compress -->
      <div class="card">
        <div class="card-head">
          <span class="card-label">Compress & Save</span>
        </div>
        <div class="card-body">

          <button class="btn btn-primary btn-capture" id="btn-cap" onclick="captureAndCompress()" disabled>
            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            Capture &amp; Compress
          </button>

          <!-- quality toggle -->
          <div class="toggle-row">
            <span class="toggle-label">Half resolution (faster, smaller)</span>
            <label class="sw">
              <input type="checkbox" id="tog-half" />
              <span class="sw-track"></span>
            </label>
          </div>

          <!-- compression progress -->
          <div class="progress-wrap" id="prog-wrap">
            <p class="progress-label" id="prog-label">Compressing…</p>
            <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
          </div>

          <!-- stats -->
          <table class="stats" id="cap-stats" style="display:none">
            <tr><td>Resolution</td>     <td id="s-res">—</td></tr>
            <tr><td>Raw pixels</td>      <td id="s-raw">—</td></tr>
            <tr><td>Compressed</td>      <td id="s-comp">—</td></tr>
            <tr><td>Ratio</td>           <td id="s-ratio">—</td></tr>
          </table>

          <div id="ratio-badge" class="r
